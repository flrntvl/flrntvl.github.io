name: Checks

# On every pull request to main (Dependabot's included): the site must build and work
# before it can be merged. Deployment stays in deploy.yml.
on:
  pull_request:
    branches: [main]
  # Allows re-running the checks manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run in progress, which is now outdated
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Name to require in main's protection rule ("Require status checks to pass")
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26 # same version as the deployment (deploy.yml)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit tests (Markdown plugins)
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # On failure: Playwright report (screenshots, traces) downloadable from the run summary
      - name: Keep the browser test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
